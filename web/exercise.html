<!DOCTYPE html>
<html lang="en" data-bs-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Exercise — Learn Go</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/theme/dracula.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/theme/eclipse.min.css">
  <link href="/css/app.css" rel="stylesheet">
</head>
<body>
  <nav class="navbar navbar-expand-lg border-bottom">
    <div class="container-fluid">
      <a class="navbar-brand fw-semibold" href="/">Learn Go</a>
      <div class="ms-auto d-flex align-items-center gap-2">
        <button id="themeToggle" class="btn btn-outline-secondary btn-sm" type="button" aria-label="Toggle theme">🌙</button>
      </div>
    </div>
  </nav>

  <main class="container-fluid py-3">
    <div id="loading" class="text-center py-5">
      <div class="spinner-border text-primary" role="status"></div>
    </div>

    <div id="exerciseContent" class="d-none row g-3">
      <div class="col-lg-5">
        <nav aria-label="breadcrumb" class="mb-2">
          <ol class="breadcrumb mb-0">
            <li class="breadcrumb-item"><a href="/">Course</a></li>
            <li class="breadcrumb-item"><a id="moduleLink" href="#">Module</a></li>
            <li class="breadcrumb-item active" id="exerciseBreadcrumb"></li>
          </ol>
        </nav>
        <h1 id="exerciseTitle" class="h4"></h1>
        <div id="exerciseNarrative" class="exercise-narrative mb-3"></div>
        <div class="d-flex gap-2">
          <button id="submitBtn" class="btn btn-primary">Run / Check</button>
          <button id="resetBtn" class="btn btn-outline-secondary">Reset</button>
        </div>
        <div id="feedback" class="mt-3"></div>
      </div>
      <div class="col-lg-7">
        <div class="editor-wrap border rounded">
          <textarea id="codeEditor"></textarea>
        </div>
      </div>
    </div>

    <div id="errorBox" class="alert alert-danger d-none m-3" role="alert"></div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/go/go.min.js"></script>
  <script src="/js/theme.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/editor.js"></script>
  <script src="/js/exercise.js"></script>
</body>
</html>
