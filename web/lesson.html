<!DOCTYPE html>
<html lang="en" data-bs-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lesson — Learn Go</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="/css/app.css" rel="stylesheet">
</head>
<body>
  <nav class="navbar navbar-expand-lg border-bottom">
    <div class="container">
      <a class="navbar-brand fw-semibold" href="/">Learn Go</a>
      <div class="ms-auto d-flex align-items-center gap-2">
        <button id="themeToggle" class="btn btn-outline-secondary btn-sm" type="button" aria-label="Toggle theme">🌙</button>
      </div>
    </div>
  </nav>

  <main class="container py-4">
    <div id="loading" class="text-center py-5">
      <div class="spinner-border text-primary" role="status"></div>
    </div>

    <div id="lessonContent" class="d-none">
      <nav aria-label="breadcrumb" class="mb-3">
        <ol class="breadcrumb">
          <li class="breadcrumb-item"><a href="/">Course</a></li>
          <li class="breadcrumb-item active" id="breadcrumbModule"></li>
        </ol>
      </nav>

      <h1 id="moduleTitle" class="h2 mb-3"></h1>
      <article id="lessonBody" class="lesson-markdown mb-4"></article>

      <div class="d-flex flex-wrap gap-2 mb-4">
        <button id="markLessonDone" class="btn btn-success">Mark lesson complete</button>
        <span id="lessonDoneBadge" class="badge text-bg-success align-self-center d-none">Lesson complete</span>
      </div>

      <h2 class="h5">Exercises</h2>
      <div id="exerciseList" class="list-group mb-4"></div>

      <div id="quizSection" class="card">
        <div class="card-body">
          <h2 class="h5 card-title">Module quiz</h2>
          <p class="text-muted small">Complete all exercises first.</p>
          <a id="quizLink" class="btn btn-primary disabled" href="#">Take quiz</a>
        </div>
      </div>

      <div id="projectSection" class="card mt-4 d-none">
        <div class="card-body">
          <h2 class="h5 card-title" id="projectTitle">Capstone project</h2>
          <p class="text-muted small">Check off each item as you complete it in your local repo.</p>
          <div id="projectChecklist" class="list-group mb-3"></div>
          <span id="projectDoneBadge" class="badge text-bg-success d-none">All project items complete</span>
        </div>
      </div>
    </div>

    <div id="errorBox" class="alert alert-danger d-none" role="alert"></div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="/js/theme.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/lesson.js"></script>
</body>
</html>
