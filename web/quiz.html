<!DOCTYPE html>
<html lang="en" data-bs-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quiz — Learn Go</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="/css/app.css" rel="stylesheet">
</head>
<body>
  <nav class="navbar navbar-expand-lg border-bottom">
    <div class="container">
      <a class="navbar-brand fw-semibold" href="/">Learn Go</a>
      <div class="ms-auto d-flex align-items-center gap-2">
        <button id="themeToggle" class="btn btn-outline-secondary btn-sm" type="button" aria-label="Toggle theme">🌙</button>
      </div>
    </div>
  </nav>

  <main class="container py-4">
    <div id="loading" class="text-center py-5">
      <div class="spinner-border text-primary" role="status"></div>
    </div>

    <div id="quizContent" class="d-none">
      <nav aria-label="breadcrumb" class="mb-3">
        <ol class="breadcrumb">
          <li class="breadcrumb-item"><a href="/">Course</a></li>
          <li class="breadcrumb-item"><a id="moduleLink" href="#">Module</a></li>
          <li class="breadcrumb-item active">Quiz</li>
        </ol>
      </nav>

      <h1 id="quizTitle" class="h2 mb-4"></h1>
      <form id="quizForm"></form>
      <button id="submitQuiz" type="button" class="btn btn-primary mt-3">Submit quiz</button>
      <div id="quizResult" class="mt-4"></div>
    </div>

    <div id="errorBox" class="alert alert-danger d-none" role="alert"></div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/theme.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/quiz.js"></script>
</body>
</html>
