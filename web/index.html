<!DOCTYPE html>
<html lang="en" data-bs-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Learn Go</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="/css/app.css" rel="stylesheet">
</head>
<body>
  <nav class="navbar navbar-expand-lg border-bottom">
    <div class="container">
      <a class="navbar-brand fw-semibold" href="/">Learn Go</a>
      <div class="ms-auto d-flex align-items-center gap-2">
        <button id="themeToggle" class="btn btn-outline-secondary btn-sm" type="button" aria-label="Toggle theme">🌙</button>
      </div>
    </div>
  </nav>

  <main class="container py-4">
    <div id="loading" class="text-center py-5">
      <div class="spinner-border text-primary" role="status"></div>
      <p class="mt-2 text-muted">Loading course...</p>
    </div>

    <div id="courseContent" class="d-none">
      <header class="mb-4">
        <h1 id="courseTitle" class="h2"></h1>
        <p id="courseDescription" class="text-muted"></p>
      </header>

      <div id="moduleList" class="list-group"></div>
    </div>

    <div id="errorBox" class="alert alert-danger d-none" role="alert"></div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/theme.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/syllabus.js"></script>
</body>
</html>
